name: serverpilot

services:

  # ── Reverse Proxy ──────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: sp-traefik
    command:
      - "--log.level=ERROR"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=sp-net"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - sp-net

  # ── Backend API ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sp-backend
    environment:
      - PORT=8081
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=postgres://${DB_USER:-serverpilot}:${DB_PASSWORD:-secret123}@postgres:5432/${DB_NAME:-serverpilot}?sslmode=disable
      - REDIS_URL=redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-prod}
      - AGENT_SECRET=${AGENT_SECRET:-dev-agent-secret-change-in-prod}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@serverpilot.local}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-changeme}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME:-Admin}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`) || Path(`/health`)"
      - "traefik.http.routers.backend.priority=10"
      - "traefik.http.services.backend.loadbalancer.server.port=8081"
    restart: unless-stopped
    networks:
      - sp-net

  # ── Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sp-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    restart: unless-stopped
    networks:
      - sp-net

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sp-postgres
    environment:
      - POSTGRES_DB=${DB_NAME:-serverpilot}
      - POSTGRES_USER=${DB_USER:-serverpilot}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-serverpilot} -d ${DB_NAME:-serverpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - sp-net

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sp-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sp-net

networks:
  sp-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
